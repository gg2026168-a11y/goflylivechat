<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>在线客服工作台 · 访客信息识别</title>
<style>
*{box-sizing:border-box} :root{--bg:#eef2f8;--card:#fff;--text:#0f172a;--muted:#64748b;--line:#e6ebf2;--brand:#2f6bff;--brand-soft:#eaf0ff}
html,body{height:100%;margin:0}body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:14px}button,input,textarea{font:inherit}[hidden]{display:none!important}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#cdd8e8;border-radius:8px}
.topbar{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;color:#fff;background:linear-gradient(100deg,#0f1a33,#1c2f57 55%,#274a86)}.brand{display:flex;align-items:center;gap:11px}.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:13px;font-weight:700;color:#06224d;background:linear-gradient(135deg,#4f8bff,#6ee7ff)}.brand h1{margin:0;font-size:15px}.brand p{margin:2px 0 0;font-size:10px;color:#93a8cc;letter-spacing:.8px}.topbar-right{display:flex;align-items:center;gap:12px;font-size:12px}.status-chip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:#ffffff12;border:1px solid #ffffff24}.dot{width:7px;height:7px;border-radius:50%;background:#34d399}.dot.offline{background:#f59e0b}.clock{font-variant-numeric:tabular-nums;color:#c6d4ec;letter-spacing:1px}
.workspace{flex:1;min-height:0;display:grid;grid-template-columns:250px minmax(0,1fr) 310px;gap:12px;padding:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 1px 2px #0f172a0a;display:flex;flex-direction:column;overflow:hidden;min-width:0;min-height:0}.side-head{padding:14px 14px 10px;border-bottom:1px solid var(--line)}.side-head h2{margin:0 0 10px;font-size:13px;display:flex;align-items:center;gap:7px}.visitor-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;margin-bottom:10px;padding:3px;border-radius:10px;background:#f1f4f9}.visitor-tab{min-width:0;padding:7px 2px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:11px;white-space:nowrap;cursor:pointer}.visitor-tab:hover{color:var(--brand)}.visitor-tab.active{background:#fff;color:var(--brand);font-weight:600;box-shadow:0 1px 5px #0f172a12}.badge{font-size:10px;padding:2px 7px;border-radius:20px;background:var(--brand-soft);color:#2f5fd0}.search{width:100%;height:34px;padding:0 11px;border:1px solid var(--line);border-radius:9px;background:#f7f9fd;font-size:12px;outline:none}.search:focus{border-color:#b9cdff;box-shadow:0 0 0 3px #2f6bff1a}.list{flex:1;overflow:auto;padding:8px}.empty{padding:36px 12px;text-align:center;color:#94a3b8;font-size:12px;line-height:1.8}.conv{width:100%;border:0;background:transparent;display:flex;gap:10px;padding:10px;border-radius:11px;cursor:pointer;text-align:left;color:inherit}.conv:hover{background:#f4f7fd}.conv.active{background:var(--brand-soft)}.conv-main{flex:1;min-width:0}.conv-top{display:flex;justify-content:space-between;gap:6px}.conv-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conv-time{font-size:10px;color:#9aa8bd}.conv-tag{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.avatar{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(135deg,#5b8def,#7c5cf0)}.avatar.sm{width:32px;height:32px;border-radius:10px}.unread{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:#ff5a5f;color:#fff;font-size:10px;margin-top:4px}
.chat-head{flex:none;display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line)}.chat-name{font-size:13px;font-weight:600}.chat-sub{font-size:11px;color:var(--muted);margin-top:2px}.chat-actions{margin-left:auto;display:flex;gap:7px}.ghost-btn,.mini-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#46536b;cursor:pointer}.ghost-btn:hover,.mini-btn:hover{border-color:#b9cdff;color:var(--brand)}.typing-preview{margin:10px 16px 0;padding:9px 12px;border:1px dashed #e5a1b7;border-radius:10px;background:#fff4f7;color:#b45d79;font-size:12px;word-break:break-all}.messages{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;background:linear-gradient(#f8fafd,#f3f6fb)}.msg{display:flex;flex-direction:column;max-width:78%}.msg.agent{align-self:flex-end;align-items:flex-end}.msg.visitor{align-self:flex-start}.msg.system{align-self:center;max-width:100%}.bubble{padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.62;white-space:pre-wrap;word-break:break-word}.msg.agent .bubble{color:#fff;border-bottom-right-radius:4px;background:linear-gradient(135deg,#3b7bff,#2f6bff)}.msg.visitor .bubble{background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}.msg.system .bubble{background:#94a3b821;color:#64748b;font-size:11px;padding:5px 12px;border-radius:20px}.meta{font-size:10px;color:#9aa8bd;margin-top:5px}.composer{flex:none;border-top:1px solid var(--line);padding:10px 14px 12px;background:#fff}.composer textarea{width:100%;height:58px;border:0;outline:none;resize:none;font-size:13px;line-height:1.6;color:var(--text)}.composer-bar{display:flex;align-items:center;gap:8px;margin-top:6px}.quick{display:flex;gap:6px;flex-wrap:wrap;flex:1}.quick button{font-size:11px;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:#f8fafd;color:#55627a;cursor:pointer}.send-btn{border:0;border-radius:9px;padding:8px 20px;color:#fff;background:linear-gradient(135deg,#3b7bff,#2f6bff);cursor:pointer}.send-btn:disabled{opacity:.45;cursor:not-allowed}
.visitor{overflow:auto;padding:14px;gap:12px}.panel-title{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}.live{font-size:10px;padding:2px 8px;border-radius:20px;color:#0f8a4d;background:#e6f9ef}.visitor-hero{display:flex;align-items:center;gap:11px}.vname{font-size:13px;font-weight:600}.vsub{font-size:11px;color:var(--muted);margin-top:3px}.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}.card-label{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.card-actions{display:flex;align-items:center;gap:5px}.mini-btn.danger{color:#d5475a;border-color:#f1cbd2}.mini-btn.danger:hover{color:#b83246;border-color:#e5a1b7;background:#fff7f8}.mini-btn:disabled{opacity:.45;cursor:not-allowed}.ip-text{font-family:ui-monospace,monospace;font-size:18px;font-weight:700;word-break:break-all}.loc{font-size:12px;color:var(--muted);margin-top:6px}.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.tag{font-size:10px;padding:3px 9px;border-radius:20px;background:var(--brand-soft);color:#2f5fd0}.rows{display:flex;flex-direction:column;gap:9px}.row{display:flex;justify-content:space-between;gap:10px;font-size:12px}.row>span{color:var(--muted);flex:none}.row>b{font-weight:600;text-align:right;word-break:break-all}.ua-box{margin-top:10px}.ua-box summary{font-size:11px;color:var(--muted);cursor:pointer}.ua-text{margin-top:8px;font-size:10px;line-height:1.6;color:#64748b;background:#f7f9fd;border:1px solid var(--line);border-radius:8px;padding:8px;word-break:break-all;font-family:ui-monospace,monospace}.timeline{display:flex;flex-direction:column}.tl-item{display:flex;gap:10px;font-size:11px;padding-bottom:12px}.tl-dot{width:8px;height:8px;border-radius:50%;flex:none;margin-top:4px;background:var(--brand)}.tl-text{flex:1;color:#46536b}.tl-time{font-size:10px;color:#9aa8bd;margin-top:2px}.toast{position:fixed;left:50%;bottom:24px;z-index:99;transform:translate(-50%,12px);background:#0f172aee;color:#fff;padding:9px 16px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1050px){.workspace{grid-template-columns:230px minmax(0,1fr)}.visitor{display:none}}@media(max-width:680px){.workspace{grid-template-columns:1fr;padding:8px}.sidebar{display:none}.topbar-right .clock{display:none}.quick{display:none}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><div class="logo">CS</div><div><h1>在线客服工作台</h1><p>CUSTOMER SERVICE CONSOLE</p></div></div><div class="topbar-right"><div class="status-chip"><span class="dot offline" id="statusDot"></span><span id="connectionStatus">等待连接</span></div><div class="clock" id="clock">--:--:--</div></div></header>
<div class="workspace">
<aside class="panel sidebar"><div class="side-head"><h2>会话列表 <span class="badge" id="convCount">0</span></h2><div class="visitor-tabs" role="tablist" aria-label="访客分类"><button class="visitor-tab active" type="button" role="tab" aria-selected="true" data-visitor-view="online">在线访客</button><button class="visitor-tab" type="button" role="tab" aria-selected="false" data-visitor-view="history">历史访客</button><button class="visitor-tab" type="button" role="tab" aria-selected="false" data-visitor-view="mine">我的访客</button></div><input class="search" id="searchInput" placeholder="搜索访客 / IP / 关键词" aria-label="搜索会话"></div><div class="list" id="convList" role="tabpanel"></div></aside>
<section class="panel chat"><div class="chat-head"><div class="avatar sm" id="chatAvatar">访</div><div><div class="chat-name" id="chatName">暂无会话</div><div class="chat-sub" id="chatSub">等待访客接入</div></div><div class="chat-actions"><button class="ghost-btn" id="transferBtn">转接</button><button class="ghost-btn" id="closeBtn">结束会话</button></div></div><div class="typing-preview" id="typingPreview" role="status" aria-live="polite" hidden></div><div class="messages" id="messages"></div><div class="composer"><textarea id="input" maxlength="2000" placeholder="输入消息，Enter 发送，Shift + Enter 换行…"></textarea><div class="composer-bar"><div class="quick"><button data-template="您好，很高兴为您服务，请问有什么可以帮您？">问候</button><button data-template="请稍等，正在为您查询。">查询中</button><button data-template="您可以在办公应用弹窗中选择 Android 或 iOS 下载。">应用下载</button><button data-template="还有其他可以帮到您的吗？">结束语</button></div><button class="send-btn" id="sendBtn" disabled>发送</button></div></div></section>
<aside class="panel visitor">
  <div class="panel-title">访客信息<span class="live">实时</span><button class="mini-btn" id="refreshBtn" style="margin-left:auto">刷新</button></div>
  <div class="visitor-hero"><div class="avatar" id="avatar">访</div><div><div class="vname" id="visitorName">暂无访客</div><div class="vsub" id="heroSub">等待访客接入</div></div></div>
  <div class="card"><div class="card-label">IP 地址<span class="card-actions"><button class="mini-btn" id="copyIp">复制</button><button class="mini-btn danger" id="blacklistBtn" disabled>加入黑名单</button></span></div><div class="ip-text" id="ipText">—</div><div class="loc" id="locText">—</div><div class="tags" id="geoTags"></div></div>
  <div class="card"><div class="card-label">设备与系统</div><div class="rows"><div class="row"><span>设备类型</span><b id="dType">—</b></div><div class="row"><span>操作系统</span><b id="dOs">—</b></div><div class="row"><span>浏览器</span><b id="dBrowser">—</b></div></div></div>
  <div class="card"><div class="card-label">环境与网络</div><div class="rows"><div class="row"><span>语言</span><b id="eLang">—</b></div><div class="row"><span>时区</span><b id="eTz">—</b></div><div class="row"><span>网络状态</span><b id="eNet">—</b></div><div class="row"><span>访问来源</span><b id="eRef">—</b></div></div></div>
  <div class="card"><div class="card-label">会话轨迹</div><div class="timeline" id="timeline"></div></div>
</aside>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=id=>document.getElementById(id),sessions=new Map();
let activeId='',socket=null,visitorView='online';
const token=localStorage.getItem('token')||'';
const channel='BroadcastChannel' in window?new BroadcastChannel('douyin.service.typing'):null;
const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const nowTime=()=>new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false});
function visitorTime(value){
  if(!value)return nowTime();
  const date=new Date(value);
  return Number.isNaN(date.getTime())?nowTime():date.toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false});
}
function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),1800)}
function activeSession(){return sessions.get(activeId)}
function ensureSession(id,data={}){
  if(!id)return null;
  let session=sessions.get(id);
  if(!session){session={id,name:data.name||data.username||'访客 '+id.slice(-6),avatar:data.avator||data.avatar||'',ip:data.client_ip||'',city:data.city||'',refer:data.refer||'',lastMessage:data.last_message||'',time:visitorTime(data.updated_at),unread:0,status:data.status===0||data.status==='0'?'offline':'online',messages:[],typing:null,environment:null,historyLoaded:false,timeline:[{text:'访客进入会话',time:nowTime()}]};sessions.set(id,session);if(!activeId&&session.status==='online')activeId=id}
  if(data.name||data.username)session.name=data.name||data.username;
  if(data.avator||data.avatar)session.avatar=data.avator||data.avatar;
  if(data.last_message)session.lastMessage=data.last_message;
  if(data.updated_at)session.time=visitorTime(data.updated_at);
  if(data.status!==undefined)session.status=data.status===1||data.status==='1'?'online':'offline';
  if(data.client_ip)session.ip=data.client_ip;if(data.city)session.city=data.city;if(data.refer)session.refer=data.refer;
  return session;
}
function renderSessions(){
  const keyword=$('searchInput').value.trim().toLowerCase();
  const viewList=[...sessions.values()].filter(s=>visitorView==='online'?s.status==='online':visitorView==='history'?s.status!=='online':true);
  const list=viewList.filter(s=>!keyword||(s.name+' '+s.id+' '+s.ip+' '+s.lastMessage).toLowerCase().includes(keyword)).sort((a,b)=>Number(b.id===activeId)-Number(a.id===activeId));
  const emptyText=visitorView==='online'?'暂无在线访客<br>等待访客从会员中心接入':visitorView==='history'?'暂无历史访客<br>离线访客记录会显示在这里':'暂无我的访客<br>访客接入后会自动显示';
  $('convCount').textContent=viewList.length;
  $('convList').innerHTML=list.map(s=>'<button class="conv '+(s.id===activeId?'active':'')+'" data-session="'+escapeHtml(s.id)+'"><span class="avatar">'+escapeHtml(s.name.charAt(0))+'</span><span class="conv-main"><span class="conv-top"><span class="conv-name">'+escapeHtml(s.name)+'</span><time class="conv-time">'+escapeHtml(s.time)+'</time></span><span class="conv-tag">'+escapeHtml(s.lastMessage||s.ip||(s.status==='online'?'在线':'历史访客'))+'</span></span>'+(s.unread?'<span class="unread">'+s.unread+'</span>':'')+'</button>').join('')||'<div class="empty">'+emptyText+'</div>';
}
async function requestVisitors(url){
  const response=await fetch(url,{headers:{token}}),result=await response.json();
  if(result.code!==200)throw new Error(result.msg||'访客列表加载失败');
  return result.result;
}
async function loadVisitorLists(){
  if(!token||location.protocol==='file:'){renderSessions();return}
  try{
    const [online,mine]=await Promise.all([requestVisitors('/visitors_kefu_online'),requestVisitors('/visitors?page=1&pagesize=100')]);
    ((mine&&mine.list)||[]).forEach(item=>ensureSession(item.visitor_id,item));
    (online||[]).forEach(item=>ensureSession(item.uid,{...item,status:1}));
    renderChat();
  }catch(error){console.warn('访客列表加载失败',error);renderSessions()}
}
function renderMessages(session){
  $('messages').innerHTML=session?session.messages.map(m=>'<div class="msg '+m.role+'"><div class="bubble">'+escapeHtml(m.content)+'</div>'+(m.role!=='system'?'<div class="meta">'+escapeHtml(m.time)+'</div>':'')+'</div>').join(''):'<div class="empty">接入访客后，可在这里查看和回复消息</div>';
  $('messages').scrollTop=$('messages').scrollHeight;
}
function renderVisitor(session){
  const env=session&&session.environment||{};
  $('visitorName').textContent=session?session.name:'暂无访客';$('avatar').textContent=session?session.name.charAt(0):'访';
  $('heroSub').textContent=session?(session.city||'地区待识别'):'等待访客接入';$('ipText').textContent=session&&session.ip||'—';$('locText').textContent=session&&session.city||'—';
  $('geoTags').innerHTML=session?[session.city,session.refer].filter(Boolean).map(v=>'<span class="tag">'+escapeHtml(v)+'</span>').join(''):'';
  const values={dType:env.deviceType,dOs:env.os,dBrowser:env.browser,eLang:env.language,eTz:env.timezone,eNet:env.network,eRef:session&&session.refer||env.referrer};
  Object.entries(values).forEach(([id,value])=>$(id).textContent=value||'—');
  const blacklistBtn=$('blacklistBtn');blacklistBtn.disabled=!session||!session.ip||Boolean(session.blacklisted);blacklistBtn.textContent=session&&session.blacklisted?'已加入黑名单':'加入黑名单';
  $('timeline').innerHTML=session?session.timeline.map(item=>'<div class="tl-item"><span class="tl-dot"></span><div class="tl-text">'+escapeHtml(item.text)+'<div class="tl-time">'+escapeHtml(item.time)+'</div></div></div>').join(''):'<div class="empty">暂无会话轨迹</div>';
}
function renderChat(){
  const s=activeSession();renderSessions();
  $('chatName').textContent=s?s.name:'暂无会话';$('chatAvatar').textContent=s?s.name.charAt(0):'访';$('chatSub').textContent=s?(s.status==='online'?'在线 · 正在接待':'会话已结束或访客离线'):'等待访客接入';
  $('typingPreview').hidden=!s||s.typing===null;if(s&&s.typing!==null)$('typingPreview').textContent='访客正在输入：'+(s.typing||'（空）');
  $('input').disabled=!s;$('sendBtn').disabled=!s||!$('input').value.trim();renderMessages(s);renderVisitor(s);
}
async function selectSession(id){
  const s=sessions.get(id);if(!s)return;
  activeId=id;s.unread=0;renderChat();
  if(!token||location.protocol==='file:'||s.historyLoaded)return;
  s.historyLoaded=true;
  try{
    const response=await fetch('/messages?visitorId='+encodeURIComponent(id),{headers:{token}}),result=await response.json();
    if(result.code!==200)throw new Error(result.msg||'聊天记录加载失败');
    s.messages=(result.result||[]).map(item=>({role:item.mes_type==='kefu'?'agent':'visitor',content:item.content,time:item.time}));
    if(activeId===id)renderChat();
  }catch(error){s.historyLoaded=false;toast(error.message||'聊天记录加载失败')}
}
function addMessage(id,role,content,time){
  const s=ensureSession(id);if(!s)return;s.messages.push({role,content,time:time||nowTime()});s.lastMessage=content;s.time=nowTime();if(role==='visitor'){s.typing=null;if(id!==activeId)s.unread++}renderChat();
}
function addTimeline(session,text){session.timeline.push({text,time:nowTime()})}
function handleMessage(message){
  const data=message.data;
  if(message.type==='userOnline'){const s=ensureSession(data.uid,data);s.status='online';renderChat();return}
  if(message.type==='userOffline'){const s=sessions.get(typeof data==='string'?data:data.uid||data.id);if(s){s.status='offline';addTimeline(s,'访客离线');renderChat()}return}
  if(message.type==='visitor_typing'||message.type==='inputing'){const s=ensureSession(data.from||'local');showTyping(s.id,data.content||'');return}
  if(message.type==='visitor_environment'){const s=ensureSession(data.from||'local',data),isNew=!s.environment;s.environment=data.environment||{};if(isNew)addTimeline(s,'访客设备与环境信息已更新');renderChat();return}
  if(message.type==='message'||message.type==='chat_message'){const id=data.from==='agent'?(data.to||activeId):(data.from||data.id);if(!id)return;addMessage(id,data.is_kefu==='yes'||data.from==='agent'?'agent':'visitor',data.content,data.time);return}
}
function showTyping(id,content){const s=ensureSession(id);if(!s)return;s.typing=String(content??'');if(id===activeId){$('typingPreview').hidden=false;$('typingPreview').textContent='访客正在输入：'+(s.typing||'（空）')}renderSessions()}
function connect(){
  if(!token||location.protocol==='file:'){$('connectionStatus').textContent='本地联调';return}
  const scheme=location.protocol==='https:'?'wss':'ws';$('connectionStatus').textContent='连接中';
  socket=new WebSocket(scheme+'://'+location.host+'/ws_kefu?token='+encodeURIComponent(token));
  socket.onopen=()=>{$('connectionStatus').textContent='服务在线';$('statusDot').classList.remove('offline')};
  socket.onmessage=event=>{try{handleMessage(JSON.parse(event.data))}catch(error){console.warn('无法解析客服消息',error)}};
  socket.onclose=()=>{$('connectionStatus').textContent='连接断开';$('statusDot').classList.add('offline')};
  socket.onerror=()=>{$('connectionStatus').textContent='连接异常';$('statusDot').classList.add('offline')};
  setInterval(()=>{if(socket&&socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify({type:'ping',data:'kefu'}))},20000);
}
async function sendMessage(){
  const s=activeSession(),input=$('input'),content=input.value.trim();if(!s||!content)return;
  $('sendBtn').disabled=true;
  try{
    if(token&&location.protocol!=='file:'){
      const body=new URLSearchParams({token,type:'kefu',to_id:s.id,content});const response=await fetch('/kefu/message',{method:'POST',body});const result=await response.json();if(result.code!==200)throw new Error(result.msg||'发送失败');
      if(!socket||socket.readyState!==WebSocket.OPEN)addMessage(s.id,'agent',content);
    }else{addMessage(s.id,'agent',content);if(channel)channel.postMessage({type:'chat_message',from:'agent',to:s.id,content})}
    input.value='';input.focus();
  }catch(error){toast(error.message||'发送失败')}finally{$('sendBtn').disabled=!activeSession()||!input.value.trim()}
}
$('convList').addEventListener('click',event=>{const button=event.target.closest('[data-session]');if(button)selectSession(button.dataset.session)});
document.querySelectorAll('[data-visitor-view]').forEach(button=>button.addEventListener('click',()=>{
  visitorView=button.dataset.visitorView;
  document.querySelectorAll('[data-visitor-view]').forEach(tab=>{const selected=tab===button;tab.classList.toggle('active',selected);tab.setAttribute('aria-selected',String(selected))});
  renderSessions();loadVisitorLists();
}));
$('searchInput').addEventListener('input',renderSessions);$('input').addEventListener('input',()=>$('sendBtn').disabled=!activeSession()||!$('input').value.trim());
$('input').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}});$('sendBtn').addEventListener('click',sendMessage);
document.querySelectorAll('[data-template]').forEach(button=>button.addEventListener('click',()=>{$('input').value=button.dataset.template;$('sendBtn').disabled=!activeSession();$('input').focus()}));
$('refreshBtn').addEventListener('click',()=>{renderVisitor(activeSession());toast('访客信息已刷新')});
$('copyIp').addEventListener('click',async()=>{const s=activeSession();if(!s||!s.ip){toast('暂无可复制的 IP');return}try{await navigator.clipboard.writeText(s.ip);toast('IP 已复制')}catch(error){toast('复制失败')}});
$('blacklistBtn').addEventListener('click',async()=>{
  const s=activeSession();if(!s||!s.ip){toast('暂无可加入黑名单的 IP');return}
  if(!token||location.protocol==='file:'){toast('请先登录客服账号');return}
  if(s.blacklisted){toast('该 IP 已在黑名单中');return}
  if(!confirm('确认将 IP '+s.ip+' 加入黑名单？'))return;
  $('blacklistBtn').disabled=true;
  try{
    const response=await fetch('/ipblack',{method:'POST',headers:{token,'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},body:new URLSearchParams({ip:s.ip})}),result=await response.json();
    if(result.code!==200)throw new Error(result.msg||'加入黑名单失败');
    s.blacklisted=true;addTimeline(s,'IP 已加入黑名单');toast(result.msg||'加入黑名单成功');
  }catch(error){toast(error.message||'加入黑名单失败')}finally{renderVisitor(activeSession())}
});
$('transferBtn').addEventListener('click',()=>toast('转接功能待接入客服分配接口'));
$('closeBtn').addEventListener('click',async()=>{const s=activeSession();if(!s)return;if(!confirm('确认结束当前访客会话？'))return;if(token&&location.protocol!=='file:'){try{await fetch('/2/close_conn?token='+encodeURIComponent(token)+'&visitor_id='+encodeURIComponent(s.id))}catch(error){}}s.status='closed';s.typing=null;addTimeline(s,'客服结束会话');s.messages.push({role:'system',content:'会话已结束',time:nowTime()});renderChat()});
if(channel)channel.onmessage=event=>{if(event.data&&event.data.type)handleMessage(event.data)};
setInterval(()=>$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false}),1000);
renderChat();connect();loadVisitorLists();
</script>
</body>
</html>
