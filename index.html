  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#c5c8e3;
    color:#202237;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .app{
    position:relative;
    width:100%;
    max-width:400px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    padding-top:calc(env(safe-area-inset-top, 0px) + 10px);
    overflow-x:hidden;
    background:
      radial-gradient(100% 24% at 50% 0%,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 70%),
      linear-gradient(180deg,
        #b3c0f6 0%,
        #b9c2f6 10%,
        #ccd0f4 30%,
        #d8d8f4 43%,
        #e9eaf8 54%,
        #f5f6fc 66%,
        #f5f6fc 100%);
  }
  @media (min-width:480px){
    body{background:#b9bfd8}
    .app{box-shadow:0 0 70px rgba(55,57,105,.20); min-height:100vh}
  }

  /* ---------- nav ---------- */
  .nav{
    position:relative;
    height:44px;
    display:flex;align-items:center;
    padding:0 16px;
  }
  .back{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:0;padding:0;margin-left:-2px;
    cursor:pointer;color:#252740;
  }
  .nav-right{position:absolute;right:14px;top:0;height:44px;width:74px}
  .service{
    position:absolute;right:0;top:2px;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    background:none;border:0;padding:0;cursor:pointer;color:#252740;
  }

  /* ---------- page head ---------- */
  .page-heading{
    padding:4px 18px 2px;
    text-align:center;
    font-family:"DouyinSans","PingFang SC","HarmonyOS Sans SC",sans-serif;
    font-size:23px;font-weight:700;letter-spacing:.2px;
    color:#181a30;
    line-height:1.35;
    z-index:2;
  }

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    aspect-ratio:1077 / 836;
    margin-top:0;
    overflow:hidden;
  }
  .hero-image{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    -webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 7%,#000 91%,transparent 100%);
    mask-image:linear-gradient(180deg,transparent 0%,#000 7%,#000 91%,transparent 100%);
  }

  /* ---------- cards ---------- */
  .card{
    margin:10px 18px 0;
    padding:16px 16px 10px;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(255,255,255,.7);
    border-radius:14px;
    box-shadow:0 1px 2px rgba(70,72,130,.025),0 8px 24px rgba(88,88,150,.05);
  }
  .card h2{
    margin:0 0 12px;
    font-size:18px;font-weight:700;letter-spacing:.2px;
    color:#1c1e33;
    line-height:1.2;
  }
  .tiles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .tile{
    position:relative;
    min-height:74px;
    border-radius:8px;
    overflow:hidden;
  }
  .t-green{background:linear-gradient(140deg,#f5f4ff 0%,#eeecfa 100%)}
  .t-pink{background:linear-gradient(140deg,#fbf5fc 0%,#f6effa 100%)}
  .t-blue{background:linear-gradient(140deg,#f2f6ff 0%,#eaf0fc 100%)}
  .t-yellow{background:linear-gradient(140deg,#f5f6fc 0%,#eef0fa 100%)}

  .links{
    display:grid;
    grid-template-columns:1fr 1fr;
    row-gap:20px;
    column-gap:8px;
    padding:2px 0 4px;
  }
  .links a{
    display:flex;align-items:center;gap:9px;
    font-size:14.5px;color:#26283b;text-decoration:none;
    letter-spacing:.1px;
    line-height:1.2;
  }
  .links a:active{opacity:.6}
  .li-ico{
    flex:0 0 auto;width:19px;height:19px;
    display:grid;place-items:center;
  }
  .li-ico svg{display:block}

  .lessons{margin-top:2px}
  .lesson{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 0;
    text-decoration:none;color:inherit;
    border-top:1px solid #f0f2f6;
  }
  .lesson:first-child{border-top:0;padding-top:0}
  .lesson:last-child{padding-bottom:2px}
  .lesson .lt{display:flex;align-items:center;gap:9px;min-width:0}
  .lesson .dot{
    width:6px;height:6px;border-radius:50%;
    background:#7588e6;flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(117,136,230,.10);
  }
  .lesson em{
    font-style:normal;font-size:14.5px;color:#292b3e;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .lesson svg{flex:0 0 auto;color:#b0b4c8}

  .foot{
    padding:22px 18px calc(34px + env(safe-area-inset-bottom));
    text-align:center;
    font-size:11px;color:#9a9eb5;
    letter-spacing:.4px;
  }

  /* home indicator */
  .home-bar{
    position:fixed;left:50%;bottom:8px;
    width:124px;height:5px;border-radius:3px;
    background:#0b0b0d;opacity:.92;
    transform:translateX(-50%);
    z-index:60;pointer-events:none;
  }
</style>
