  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#c5c8e3;
    color:#202237;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .app{
    position:relative;
    width:100%;
    max-width:400px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    overflow-x:hidden;
    background:
      radial-gradient(100% 24% at 50% 0%,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 70%),
      linear-gradient(180deg,
        #b3c0f6 0%,
        #b9c2f6 10%,
        #ccd0f4 30%,
        #d8d8f4 43%,
        #e9eaf8 54%,
        #f5f6fc 66%,
        #f5f6fc 100%);
  }
  @media (min-width:480px){
    body{background:#b9bfd8}
    .app{box-shadow:0 0 70px rgba(55,57,105,.20); min-height:100vh}
  }

  /* ---------- stitched top background ---------- */
  .top-area{
    padding-top:calc(env(safe-area-inset-top, 0px) + 10px);
    background:url("assets/douyin-live-top-bg.png") center bottom / 100% 100% no-repeat;
  }

  /* ---------- nav ---------- */
  .nav{
    position:relative;
    height:44px;
    display:flex;align-items:center;
    padding:0 16px;
  }
  .back{
    width:32px;height:32px;
    display:flex;align-items:center;justify-content:center;
    background:none;border:0;padding:0;margin-left:-2px;
    cursor:pointer;color:#252740;
  }
  .nav-right{position:absolute;right:14px;top:0;height:44px;width:74px}
  .service{
    position:absolute;right:0;top:2px;
    width:32px;height:32px;display:flex;align-items:center;justify-content:center;
    background:none;border:0;padding:0;cursor:pointer;color:#252740;
  }

  /* ---------- page head ---------- */
  .page-heading{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:4px 18px 0;
    text-align:center;
    font-family:"DouyinSans","PingFang SC","HarmonyOS Sans SC",sans-serif;
    font-size:clamp(22px,6.65vw,26px);font-weight:700;letter-spacing:.1px;
    white-space:nowrap;
    color:#0b0c0f;
    line-height:1.2;
    z-index:2;
  }
  .page-heading svg{display:block;flex:0 0 auto}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    aspect-ratio:768 / 621;
    margin-top:-1px;
    overflow:hidden;
  }
  .hero-image{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
    -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 91%,transparent 100%);
    mask-image:linear-gradient(180deg,#000 0%,#000 91%,transparent 100%);
  }

  /* ---------- cards ---------- */
  .card{
    margin:10px clamp(14px,4.6vw,18px) 0;
    padding:16px 16px 10px;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(255,255,255,.7);
    border-radius:14px;
    box-shadow:0 1px 2px rgba(70,72,130,.025),0 8px 24px rgba(88,88,150,.05);
  }
  .card h2{
    margin:0 0 12px;
    font-size:18px;font-weight:700;letter-spacing:.2px;
    color:#1c1e33;
    line-height:1.2;
  }
  .glass-card{
    margin-top:8px;
    padding:6px;
    background:rgba(255,255,255,.82);
  }
  .glass-card .tiles{gap:6px}
  .tiles{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .tile{
    position:relative;
    display:block;
    aspect-ratio:588 / 251;
    min-height:0;
    border-radius:12px;
    overflow:hidden;
    background:#e7eeff;
    box-shadow:0 5px 14px rgba(88,117,185,.08);
  }
  .tile img{
    display:block;
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .tile:active{opacity:.78}

  .member-card{
    padding:16px 10px 10px;
    background:#f5f5f9;
  }
  .member-card h2{margin-left:6px}
  .member-features{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
  }
  .member-feature{
    display:flex;
    align-items:center;
    gap:clamp(6px,2vw,8px);
    min-width:0;
    padding:clamp(11px,3.3vw,13px) clamp(8px,2.6vw,10px);
    background:#fff;
    border-radius:10px;
    text-decoration:none;
  }
  .member-feature:active{opacity:.72}
  .member-feature img{
    width:clamp(30px,8.7vw,36px);
    height:clamp(30px,8.7vw,36px);
    object-fit:contain;
    flex:0 0 auto;
  }
  .feature-copy{
    display:flex;
    flex-direction:column;
    gap:5px;
    min-width:0;
  }
  .feature-copy strong{
    color:#242433;
    font-size:clamp(13px,3.8vw,15px);
    font-weight:600;
    line-height:1.15;
    white-space:nowrap;
  }
  .feature-copy small{
    color:#9696a3;
    font-size:clamp(9px,2.8vw,11px);
    line-height:1.2;
    letter-spacing:-.2px;
    white-space:nowrap;
  }

  .lessons{margin-top:2px}
  .lesson{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 0;
    text-decoration:none;color:inherit;
    border-top:1px solid #f0f2f6;
  }
  .lesson:first-child{border-top:0;padding-top:0}
  .lesson:last-child{padding-bottom:2px}
  .lesson .lt{display:flex;align-items:center;gap:9px;min-width:0}
  .lesson .dot{
    width:6px;height:6px;border-radius:50%;
    background:#7588e6;flex:0 0 auto;
    box-shadow:0 0 0 3px rgba(117,136,230,.10);
  }
  .lesson em{
    font-style:normal;font-size:clamp(13px,3.7vw,14.5px);color:#292b3e;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .lesson svg{flex:0 0 auto;color:#b0b4c8}

  .foot{
    padding:22px 18px calc(34px + env(safe-area-inset-bottom));
    text-align:center;
    font-size:11px;color:#9a9eb5;
    letter-spacing:.4px;
  }

  /* office application download dialog */
  .office-modal[hidden]{display:none}
  .office-modal{
    position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:rgba(37,43,79,.22);
    -webkit-backdrop-filter:blur(7px);
    backdrop-filter:blur(7px);
  }
  .office-dialog{
    position:relative;width:min(100%,320px);
    padding:28px 24px 22px;
    border:1px solid rgba(255,255,255,.88);
    border-radius:26px;
    background:linear-gradient(145deg,rgba(255,255,255,.80),rgba(255,255,255,.54));
    box-shadow:0 24px 70px rgba(45,48,98,.20),inset 0 1px 0 rgba(255,255,255,.92);
    -webkit-backdrop-filter:blur(24px) saturate(160%) brightness(1.08);
    backdrop-filter:blur(24px) saturate(160%) brightness(1.08);
    text-align:center;color:#171c36;
    animation:office-in .22s ease-out;
  }
  .office-close{
    position:absolute;top:12px;right:12px;
    width:32px;height:32px;display:grid;place-items:center;
    border:1px solid rgba(255,255,255,.70);border-radius:50%;padding:0;
    color:#343c60;background:rgba(255,255,255,.64);cursor:pointer;
  }
  .office-close:active{background:rgba(255,255,255,.88)}
  .office-app-icon{
    display:block;width:78px;height:78px;margin:0 auto 14px;
    border:1px solid rgba(255,255,255,.78);border-radius:21px;
    box-shadow:0 10px 26px rgba(76,103,173,.20),0 0 0 4px rgba(255,255,255,.20);
    filter:brightness(1.10) saturate(1.12) contrast(1.06);
  }
  .office-dialog h2{margin:0;font-size:24px;line-height:1.3;color:#141a35;font-weight:700}
  .office-subtitle{margin:9px 0 0;font-size:14px;color:#454d6c;font-weight:500;line-height:1.65}
  .office-meta{margin:14px 0 0;font-size:12px;color:#68708e;font-weight:500}
  .office-tags{display:flex;justify-content:center;gap:7px;margin:18px 0}
  .office-tags span{
    padding:5px 9px;border:1px solid rgba(255,255,255,.72);border-radius:20px;
    background:rgba(255,255,255,.46);font-size:12px;color:#3e496e;font-weight:500;
  }
  .office-download{
    width:100%;height:48px;padding:0 20px;
    display:flex;align-items:center;justify-content:center;gap:9px;
    border:1px solid rgba(255,255,255,.92);border-radius:999px;
    background:rgba(255,255,255,.82);
    box-shadow:0 7px 18px rgba(75,85,135,.10),inset 0 1px 0 #fff;
    color:#5c70aa;font-size:15px;font-weight:600;cursor:pointer;
    transition:background .2s,color .2s,box-shadow .2s,transform .2s;
  }
  .office-platform-icon{width:21px;height:21px;flex:0 0 auto}
  .office-downloads{display:grid;gap:10px}
  .office-download.selected{
    border-color:transparent;color:#fff;
    background:linear-gradient(135deg,#5f8fef,#737fe5);
    box-shadow:0 9px 22px rgba(91,116,218,.30),inset 0 1px 0 rgba(255,255,255,.28);
  }
  .office-download:active{transform:scale(.98);opacity:.94}
  .office-safe{margin:12px 0 0;font-size:12px;color:#6c7491}
  .staff-dialog{width:min(100%,340px);text-align:left}
  .staff-dialog h2,.staff-dialog .office-subtitle{text-align:center}
  .staff-verify-icon{width:64px;height:64px;margin:0 auto 14px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.78);border-radius:19px;color:#6178d8;background:rgba(255,255,255,.56);box-shadow:0 10px 26px rgba(76,103,173,.14)}
  .staff-form{display:grid;gap:14px;margin-top:22px}
  .staff-field{display:grid;gap:7px}
  .staff-field span{font-size:13px;font-weight:600;color:#343c60}
  .staff-field input{width:100%;height:48px;padding:0 15px;border:1px solid rgba(255,255,255,.92);border-radius:14px;outline:0;background:rgba(255,255,255,.64);box-shadow:inset 0 1px 0 rgba(255,255,255,.86);color:#202743;font:inherit;font-size:14px;transition:border-color .2s,box-shadow .2s,background .2s}
  .staff-field input::placeholder{color:#9299b2}
  .staff-field input:focus{border-color:rgba(103,126,222,.58);background:rgba(255,255,255,.84);box-shadow:0 0 0 4px rgba(103,126,222,.12)}
  .staff-submit{height:48px;margin-top:4px;border:0;border-radius:999px;background:linear-gradient(135deg,#5f8fef,#737fe5);box-shadow:0 9px 22px rgba(91,116,218,.26),inset 0 1px 0 rgba(255,255,255,.28);color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:transform .2s,opacity .2s}
  .staff-submit:active{transform:scale(.98);opacity:.94}
  .staff-privacy{text-align:center}
  .staff-form[hidden],.staff-loading[hidden],.staff-credential[hidden]{display:none!important}.staff-loading{padding:28px 0 18px;text-align:center}.staff-loading-spinner{width:42px;height:42px;margin:0 auto 15px;border:3px solid rgba(99,127,224,.16);border-top-color:#657fdf;border-radius:50%;animation:staff-spin .8s linear infinite}.staff-loading strong{display:block;color:#303959;font-size:16px}.staff-loading p{margin:7px 0 0;color:#7a839e;font-size:12px}
  .staff-credential-image{display:block;width:min(100%,258px);height:auto;margin:18px auto 0;border:1px solid rgba(255,255,255,.88);border-radius:22px;box-shadow:0 18px 38px rgba(37,45,83,.20)}
  .staff-id-card{position:relative;width:min(100%,258px);margin:18px auto 0;overflow:hidden;border:1px solid rgba(255,255,255,.88);border-radius:22px;background:#fff;box-shadow:0 18px 38px rgba(37,45,83,.20);text-align:center}.staff-id-card:before{content:"";position:absolute;z-index:1;top:-48px;right:-42px;width:130px;height:110px;border-radius:50%;background:linear-gradient(135deg,#ff2b68,#bf0753);transform:rotate(-20deg)}.staff-id-card:after{content:"";position:absolute;z-index:1;left:-42px;bottom:28px;width:120px;height:52px;border-radius:50%;background:#13dce5;transform:rotate(24deg)}.staff-card-head{position:relative;z-index:2;height:59px;padding:0 18px;display:flex;align-items:center;gap:8px;background:linear-gradient(115deg,#10172a,#11152a 65%,#401135);color:#fff;text-align:left}.staff-card-head svg{width:27px;height:27px;flex:0 0 auto}.staff-card-head strong{font-size:17px}.staff-card-head i{width:1px;height:16px;background:rgba(255,255,255,.38)}.staff-card-head span{font-size:10px;letter-spacing:.4px}.staff-card-body{position:relative;z-index:2;padding:16px 19px 17px}.staff-card-avatar{width:76px;height:84px;margin:0 auto 10px;display:grid;place-items:center;border:4px solid #fff;border-radius:17px;background:linear-gradient(145deg,#e9edff,#d9e1f7);box-shadow:0 5px 16px rgba(71,86,140,.15);color:#536aa9;font-size:34px;font-weight:700}.staff-card-body h3{margin:0;color:#151a2d;font-size:23px;line-height:1.35}.staff-card-department{margin:3px 0 13px!important;color:#3c4358!important;font-size:13px!important}.staff-card-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #edf0f5;color:#7a8194;font-size:11px;text-align:left}.staff-card-row b{color:#272e44;font-size:12px;font-weight:600;text-align:right;word-break:break-all}.staff-card-verified{margin-top:10px;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:10px;background:#eef5ff;color:#3975c6;font-size:11px;font-weight:600}.staff-card-verified svg{width:16px;height:16px}.staff-card-foot{position:relative;z-index:2;padding:9px 12px 10px;background:#11182b;color:#fff;font-size:13px;font-weight:600;letter-spacing:1px}.staff-card-foot small{display:block;margin-top:2px;color:#aeb8ce;font-size:8px;font-weight:400;letter-spacing:.5px}.staff-query-again{width:100%;height:42px;margin-top:14px;border:1px solid rgba(255,255,255,.92);border-radius:999px;background:rgba(255,255,255,.70);color:#5c70aa;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.staff-query-again:active{background:rgba(255,255,255,.92)}
  @keyframes staff-spin{to{transform:rotate(360deg)}}@keyframes office-in{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.office-dialog{animation:none}.staff-loading-spinner{animation:none}}

  /* home indicator */

<script>
(()=>{
  const CONFIG_KEY='douyin.officeApp.config.v1';
  const trigger=document.getElementById('officeAppTrigger');
  const modal=document.getElementById('officeAppModal');
  const closeButton=document.getElementById('officeAppClose');
  const androidButton=document.getElementById('androidAppDownload');
  const iosButton=document.getElementById('iosAppDownload');
  const downloadHint=document.getElementById('officeDownloadHint');
  const appTitle=document.getElementById('officeAppTitle');
  const appIcon=modal.querySelector('.office-app-icon');
  const readConfig=()=>{
    try{return {...JSON.parse(localStorage.getItem(CONFIG_KEY)||'{}')}}catch(error){return {}}
  };
  const validDownloadUrl=value=>{
    try{return ['http:','https:'].includes(new URL(value).protocol)}catch(error){return false}
  };
  const applyConfig=()=>{
    const config=readConfig();
    const name=typeof config.name==='string'&&config.name.trim()?config.name.trim():'办公应用';
    appTitle.textContent=name;
    appIcon.src=typeof config.icon==='string'&&config.icon?config.icon:'assets/icon-office.png';
    appIcon.alt=name+'图标';
    trigger.querySelector('img').alt=name;
    androidButton.setAttribute('aria-label','下载'+name+' Android 安卓版');
    iosButton.setAttribute('aria-label','下载'+name+'苹果 iOS 版');
    downloadHint.textContent='安全下载';
    downloadHint.style.color='';
  };
  const openModal=()=>{
    applyConfig();
    modal.hidden=false;
    document.body.style.overflow='hidden';
    closeButton.focus();
  };
  const closeModal=()=>{
    modal.hidden=true;
    document.body.style.overflow='';
    trigger.focus();
  };
  const selectPlatform=platform=>{
    const isAndroid=platform==='android';
    androidButton.classList.toggle('selected',isAndroid);
    iosButton.classList.toggle('selected',!isAndroid);
    androidButton.setAttribute('aria-pressed',String(isAndroid));
    iosButton.setAttribute('aria-pressed',String(!isAndroid));
  };
  const downloadApp=platform=>{
    selectPlatform(platform);
    const config=readConfig();
    const isAndroid=platform==='android';
    const label=isAndroid?'Android 安卓':'苹果 iOS';
    const url=isAndroid?config.androidUrl:config.iosUrl;
    if(!validDownloadUrl(url)){
      downloadHint.textContent='暂未配置 '+label+' 下载链接，请联系管理员';
      downloadHint.style.color='#a45d6c';
      return;
    }
    const link=document.createElement('a');
    link.href=url;
    link.target='_blank';
    link.rel='noopener noreferrer';
    link.download='';
    document.body.appendChild(link);
    link.click();
    link.remove();
    downloadHint.textContent='已打开 '+label+' 下载链接';
    downloadHint.style.color='#38866b';
  };
  trigger.addEventListener('click',event=>{event.preventDefault();openModal()});
  closeButton.addEventListener('click',closeModal);
  modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});
  androidButton.addEventListener('click',()=>downloadApp('android'));
  iosButton.addEventListener('click',()=>downloadApp('ios'));
  window.addEventListener('storage',event=>{if(event.key===CONFIG_KEY)applyConfig()});
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&!modal.hidden)closeModal();
  });
  applyConfig();
})();
</script>
<script>
(()=>{
  const trigger=document.getElementById('staffVerifyTrigger');
  const modal=document.getElementById('staffVerifyModal');
  const closeButton=document.getElementById('staffVerifyClose');
  const form=document.getElementById('staffVerifyForm');
  const nameInput=document.getElementById('staffName');
  const numberInput=document.getElementById('staffNumber');
  const submitButton=document.getElementById('staffSubmit');
  const loading=document.getElementById('staffVerifyLoading');
  const credential=document.getElementById('staffCredential');
  const description=document.getElementById('staffVerifyDesc');
  const hint=document.getElementById('staffVerifyHint');
  const credentialImage=document.getElementById('staffCredentialImage');
  const staffRecords=Array.isArray(window.STAFF_CREDENTIALS)?window.STAFF_CREDENTIALS:[];
  let queryTimer;
  const resetState=()=>{
    clearTimeout(queryTimer);form.hidden=false;loading.hidden=true;credential.hidden=true;credentialImage.removeAttribute('src');
    submitButton.disabled=false;submitButton.textContent='立即查询';hint.style.color='';
    description.textContent='请输入工作人员姓名和工号';hint.textContent='请核对工作人员姓名与工号';
  };
  const openModal=()=>{resetState();modal.hidden=false;document.body.style.overflow='hidden';nameInput.focus()};
  const closeModal=()=>{modal.hidden=true;document.body.style.overflow='';resetState();trigger.focus()};
  trigger.addEventListener('click',event=>{event.preventDefault();openModal()});
  closeButton.addEventListener('click',closeModal);
  modal.addEventListener('click',event=>{if(event.target===modal)closeModal()});
  [nameInput,numberInput].forEach(input=>input.addEventListener('input',()=>input.setCustomValidity('')));
  form.addEventListener('submit',event=>{
    event.preventDefault();
    const name=nameInput.value.trim(),number=numberInput.value.trim();
    nameInput.setCustomValidity('');numberInput.setCustomValidity('');
    if(!name){nameInput.setCustomValidity('请输入工作人员姓名');nameInput.reportValidity();return}
    if(!number){numberInput.setCustomValidity('请输入工作人员工号');numberInput.reportValidity();return}
    submitButton.disabled=true;submitButton.textContent='查询中…';form.hidden=true;credential.hidden=true;loading.hidden=false;hint.style.color='';
    description.textContent='正在查询工作人员信息';hint.textContent='正在查询电子工作证，请稍候';
    queryTimer=setTimeout(()=>{
      const record=staffRecords.find(item=>item.name===name&&item.number.toUpperCase()===number.toUpperCase());
      loading.hidden=true;
      if(!record){
        form.hidden=false;submitButton.disabled=false;submitButton.textContent='立即查询';
        description.textContent='未找到对应工作人员';hint.textContent='未查询到对应电子工作证，请核对姓名和工号';hint.style.color='#a45d6c';return;
      }
      credentialImage.src=record.image;credentialImage.alt=record.name+'电子工作证';
      credential.hidden=false;description.textContent=record.name+' · '+record.department;
      hint.textContent='已匹配工作人员电子工作证';hint.style.color='#38866b';
    },1200);
  });
  document.getElementById('staffQueryAgain').addEventListener('click',()=>{resetState();nameInput.focus()});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!modal.hidden)closeModal()});
})();
</script>
